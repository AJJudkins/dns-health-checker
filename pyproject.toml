[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-health-checker"
version = "0.2.0"
description = "Check DNS resolution, latency and records for a list of domains, with CI-friendly exit codes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dns = ["dnspython>=2.0"]
dev = ["pytest"]

[project.scripts]
dnscheck = "dnscheck:main"

[tool.setuptools]
py-modules = ["dnscheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
